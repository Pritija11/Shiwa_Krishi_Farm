name: CI/CD Pipeline

on:
  push:
    branches:
      - preshna-pipeline

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (non-blocking for now)
        run: npm run lint || true

      - name: Download RDS certificate
        run: |
          sudo mkdir -p /etc/ssl/rds
          sudo curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            -o /etc/ssl/rds/global-bundle.pem

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js application
        run: npm run build

      - name: Build Docker image
        run: docker build -t shiwa-krishi-farm .
