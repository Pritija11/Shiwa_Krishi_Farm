name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd ~/Shiwa_Krishi_Farm
          git checkout main
          git pull origin main

      - name: Build new Docker image
        run: |
          cd ~/Shiwa_Krishi_Farm
          docker build -t shiwa-krishi-prod .

      - name: Restart production container
        run: |
          docker stop shiwa-krishi-prod || true
          docker rm shiwa-krishi-prod || true
          docker run -d \
            --name shiwa-krishi-prod \
            --env-file /home/ec2-user/Shiwa_Krishi_Farm/.env \
            -p 127.0.0.1:3000:3000 \
            --restart unless-stopped \
            shiwa-krishi-prod
