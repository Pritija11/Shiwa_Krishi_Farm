name: CI/CD Pipeline

on:
  push:
    branches:
      - preshna-pipeline
  pull_request:
    branches:
      - feature/farm-website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Build Docker image
        run: docker build -t shiwa-krishi-farm .